        zip:
          type: string
        meetingLink:
          type: string
        timezone:
          type: string
        date:
          type: string
          format: date-time
        startTime:
          type: string
          example: "10:00 AM"
        endTime:
          type: string
          example: "12:30 PM"
        entryRequirement:
          type: string
          enum: [free, token-stake]
        tokenAmount:
          type: string
        tokenAddress:
          type: string
        badgeName:
          type: string
        badgeDescription:
          type: string
        nftRewardEnabled:
          type: string
          enum: ["true", "false"]
        coverImage:
          type: string
          format: binary
        coverImageUrl:
          type: string
        badgeImage:
          type: string
          format: binary
        badgeImageUrl:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    # Error Types
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized (e.g. login required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Forbidden (e.g. admin required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

# Apply authentication to all endpoints that might need it
security:
  - bearerAuth: []
  - {} # Allow unauthenticated access as well