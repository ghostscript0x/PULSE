openapi: 3.0.3
info:
  title: Zero Authority Platform API
  description: |
    The Zero Authority Platform API provides endpoints for managing bounties, gigs, and users in a decentralized marketplace.
    This API supports filtering, pagination, and caching for optimal performance.
  version: 1.0.0
  contact:
    name: Zero Authority Team
    url: https://zeroauthority.dao
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api
    description: Current origin (same domain as this page – use for testnet or mainnet)
  - url: https://zeroauthoritydao.com/api
    description: Production (mainnet)
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: bounties
    description: Bounty management operations
  - name: gigs
    description: Gig marketplace operations
  - name: grants
    description: Grant management and tracking operations
  - name: users
    description: User profile and management operations
  - name: categories
    description: Bounty categories
  - name: organizations
    description: Organization management
  - name: services
    description: Service offerings
  - name: quests
    description: Quest operations
  - name: events
    description: Event discovery, creation, editing, and RSVP operations
  - name: stxgov
    description: Stacks SIP listing, SIP detail, and CAB (Consideration Advisory Board) voting aggregates
  - name: platform
    description: Platform-wide aggregate statistics

paths:
  /sips:
    get:
      tags:
        - stxgov
      summary: List SIPs
      operationId: get_sips
      description: |
        Returns SIPs merged from ratified data and the database, with optional filters.
        Use the same SIP identifier forms as the platform (e.g. `sip-032`, idea keys).
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: Paginated or list payload (implementation-defined)
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sips/{id}:
    get:
      tags:
        - stxgov
      summary: Get SIP by id
      operationId: get_sip_by_id
      description: Single SIP record with effective CAB voting status when applicable.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: SIP key or id (e.g. sip-032, UUID, or normalized idea id)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sips/{id}/cab-votes:
    get:
      tags:
        - stxgov
      summary: CAB voting state for a SIP
      operationId: get_sip_cab_votes
      description: |
        Aggregate yes/no/abstain counts per CAB voting instance, optional GitHub SIP fields,
        and per-session currentUser fields when authenticated. Full roll-call is not included
        in the default response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: SIP key used when opening CAB voting (must match CabVotingInstance.sipKey)
        - name: include
          in: query
          schema:
            type: string
            enum: [votes]
          description: Set to `votes` with an authenticated CAB member (or manager) to include per-voter roll-call
        - name: detail
          in: query
          schema:
            type: string
            enum: [full]
          description: Alias for roll-call inclusion (same as include=votes)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sips/stats:
    get:
      tags:
        - stxgov
      summary: SIP and CAB aggregate stats
      operationId: get_sip_stats
      responses:
        "200":
          description: Counts for GitHub SIP rows, CAB groups, open/closed voting instances
          content:
            application/json:
              schema:
                type: object
        "500":
          $ref: "#/components/responses/InternalServerError"

  /stats:
    get:
      tags:
        - platform
      summary: Platform aggregate stats
      operationId: get_platform_stats
      description: Returns total counts across gigs, bounties, quests, events, DeGrants, tokens, SIP IDs, and TVE (total value exchanged in USD).
      responses:
        "200":
          description: Aggregate platform counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      gigs:
                        type: integer
                      bounties:
                        type: integer
                      quests:
                        type: integer
                      events:
                        type: integer
                      degrants:
                        type: integer
                      tokens:
                        type: integer
                      sipIds:
                        type: integer
                      tveUsd:
                        type: number
                        description: TVE (total value exchanged) in USD, computed from all token-priced bounty and milestone value ever transacted.
                  meta:
                    type: object
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sips/{id}/cab-votes/open:
    post:
      tags:
        - stxgov
      summary: Open CAB voting for a SIP
      operationId: post_sip_cab_votes_open
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cabGroupId]
              properties:
                cabGroupId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Created voting instance
        "400":
          $ref: "#/components/responses/BadRequest"

  /sips/{sipId}/cab/{cabGroupId}:
    get:
      tags:
        - stxgov
      summary: CAB voting for one group on a SIP
      operationId: get_sip_cab_by_group
      parameters:
        - name: sipId
          in: path
          required: true
          schema:
            type: string
        - name: cabGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Filtered instances for this SIP and CAB group
        "404":
          $ref: "#/components/responses/NotFound"

  /sips/{sipId}/cab/{cabGroupId}/members:
    get:
      tags:
        - stxgov
      summary: CAB group members (SIP-scoped)
      operationId: get_sip_cab_members
      parameters:
        - name: sipId
          in: path
          required: true
          schema:
            type: string
        - name: cabGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fields
          in: query
          schema:
            type: string
            enum: [full]
          description: Use `full` to include email when permitted
      responses:
        "200":
          description: Member roster
        "404":
          $ref: "#/components/responses/NotFound"

  /sips/{sipId}/cab/{cabGroupId}/votes:
    get:
      tags:
        - stxgov
      summary: Roll-call for latest instance (this SIP + group)
      operationId: get_sip_cab_votes_latest_rollcall
      responses:
        "200":
          description: Vote list
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sips/{sipId}/cab/{cabGroupId}/instances/{instanceId}/votes:
    get:
      tags:
        - stxgov
      summary: Roll-call for a specific voting instance
      operationId: get_sip_cab_instance_votes
      responses:
        "200":
          description: Vote list
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cab-groups:
    get:
      tags:
        - stxgov
      summary: List CAB groups
      operationId: get_cab_groups
      responses:
        "200":
          description: Success
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - stxgov
      summary: Create CAB group
      operationId: post_cab_groups
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cab-groups/{groupId}:
    get:
      tags:
        - stxgov
      summary: Get CAB group
      operationId: get_cab_group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - stxgov
      summary: Update CAB group
      operationId: patch_cab_group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - stxgov
      summary: Delete CAB group
      operationId: delete_cab_group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /cab-groups/{groupId}/voting-overview:
    get:
      tags:
        - stxgov
      summary: CAB voting overview for a group (open and closed sessions)
      operationId: get_cab_group_voting_overview
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /cab-groups/{groupId}/members:
    get:
      tags:
        - stxgov
      summary: List members (admin API)
      operationId: get_cab_group_members
      responses:
        "200":
          description: Success
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - stxgov
      summary: Add CAB member
      operationId: post_cab_group_members
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [Admin, Member]
                email:
                  type: string
      responses:
        "200":
          description: Created or updated
        "400":
          $ref: "#/components/responses/BadRequest"

  /cab-groups/{groupId}/members/{userId}:
    patch:
      tags:
        - stxgov
      summary: Update member role
      operationId: patch_cab_group_member
      responses:
        "200":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
        - stxgov
      summary: Remove member
      operationId: delete_cab_group_member
      responses:
        "200":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"

  /cab-voting-instances/{instanceId}/close:
    post:
      tags:
        - stxgov
      summary: Close CAB voting
      operationId: post_cab_voting_instance_close
      responses:
        "200":
          description: Closed with tallies
        "400":
          $ref: "#/components/responses/BadRequest"

  /cab-voting-instances/{instanceId}/votes:
    post:
      tags:
        - stxgov
      summary: Cast or update CAB vote
      operationId: post_cab_voting_instance_vote
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice:
                  type: string
                  enum: [Yes, No, Abstain]
      responses:
        "200":
          description: Vote recorded
        "400":
          $ref: "#/components/responses/BadRequest"

  /cab-voting-instances/{instanceId}/export:
    get:
      tags:
        - stxgov
      summary: Export CAB vote record
      operationId: get_cab_voting_instance_export
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, markdown, csv]
          description: Defaults to json with markdown+csv in payload; use markdown or csv for file download
      responses:
        "200":
          description: JSON, markdown, or CSV body
        "403":
          $ref: "#/components/responses/Forbidden"

  /bounties:
    get:
      tags:
        - bounties
      summary: List bounties
      description: |
        Retrieve a paginated list of bounties with optional filtering and sorting.
        Supports filtering by status, type, category, organization, creator, winner, token, and more.
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of bounties per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search in bounty name and details
          schema:
            type: string
        - name: status
          in: query
          description: Filter by bounty status (comma-separated)
          schema:
            type: string
            enum: [Open, Closed, Winner]
        - name: type
          in: query
          description: Filter by bounty type (comma-separated)
          schema:
            type: string
            enum: [SingleWinner, CommunityDriven, MultiWinner, Top3Bidder]
        - name: category
          in: query
          description: Filter by category name
          schema:
            type: string
        - name: organization
          in: query
          description: Filter by organization name
          schema:
            type: string
        - name: creator
          in: query
          description: Filter by creator STX address
          schema:
            type: string
        - name: winner
          in: query
          description: Filter by winner STX address
          schema:
            type: string
        - name: token
          in: query
          description: Filter by token address, symbol, or name
          schema:
            type: string
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [createdAt, updatedAt, startDate, endDate, name, totalPayment, status, type, submissionsCount]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: startDate
          in: query
          description: Filter bounties created after this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter bounties created before this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: minValue
          in: query
          description: Minimum total payment value (in smallest token unit)
          schema:
            type: string
        - name: maxValue
          in: query
          description: Maximum total payment value (in smallest token unit)
          schema:
            type: string
        - name: hasSubmissions
          in: query
          description: Filter by submission presence
          schema:
            type: boolean
        - name: isCompleted
          in: query
          description: Filter by completion status
          schema:
            type: boolean
        - name: includeExpired
          in: query
          description: Include expired bounties
          schema:
            type: boolean
            default: true
        - name: stats
          in: query
          description: Return statistics instead of bounty list
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BountyListResponse'
                  - $ref: '#/components/schemas/BountyStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bounties/{id}:
    get:
      tags:
        - bounties
      summary: Get bounty by ID
      description: Retrieve detailed information about a specific bounty
      parameters:
        - name: id
          in: path
          required: true
          description: Bounty ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bounties/categories:
    get:
      tags:
        - categories
      summary: List bounty categories
      description: Retrieve all bounty categories with bounty counts
      parameters:
        - name: includeEmpty
          in: query
          description: Include categories with no bounties
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bounties/organizations:
    get:
      tags:
        - organizations
      summary: List organizations
      description: Retrieve organizations that have created bounties with statistics
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gigs:
    get:
      tags:
        - gigs
      summary: List gigs
      description: |
        Retrieve a paginated list of gigs with optional filtering and sorting.
        Gigs represent work agreements between clients and workers.
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of gigs per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search in gig title and description
          schema:
            type: string
        - name: status
          in: query
          description: Filter by gig status
          schema:
            type: string
            enum: [requested, in-progress, in-review, completed, rejected, disputed, mixed]
        - name: service
          in: query
          description: Filter by service name
          schema:
            type: string
        - name: client
          in: query
          description: Filter by client STX address
          schema:
            type: string
        - name: worker
          in: query
          description: Filter by worker STX address
          schema:
            type: string
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [createdAt, updatedAt, startDate, endDate, title, service]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: startDate
          in: query
          description: Filter gigs created after this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter gigs created before this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: minValue
          in: query
          description: Minimum total value (in smallest token unit)
          schema:
            type: string
        - name: maxValue
          in: query
          description: Maximum total value (in smallest token unit)
          schema:
            type: string
        - name: tokenAddress
          in: query
          description: Filter by token address
          schema:
            type: string
        - name: includeDisputed
          in: query
          description: Include disputed gigs
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gigs/{id}:
    get:
      tags:
        - gigs
      summary: Get gig by ID
      description: Retrieve detailed information about a specific gig
      parameters:
        - name: id
          in: path
          required: true
          description: Gig ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gigs/stats:
    get:
      tags:
        - gigs
      summary: Get gig statistics
      description: Retrieve platform-wide gig statistics
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigStatsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quest/all:
    get:
      tags:
        - quests
      summary: List all quests
      description: |
        Retrieve a paginated list of quests (only those with a mined create transaction).
        Supports filtering by search, status, and sorting.
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of quests per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search in title, description, and organization name
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [all, active, completed, expired]
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [newest, oldest, most-participants, highest-reward, ending-soon]
            default: newest
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quests:
    get:
      tags:
        - quests
      summary: List quests (Next.js API)
      description: |
        Retrieve a paginated list of quests using the Next.js `/api/quests` route.
        This endpoint returns the same Quest objects used in the app, including extended creator
        fields and submissions metadata.
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of quests per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search in title, description, and organization name
          schema:
            type: string
        - name: tab
          in: query
          description: Tab filter (expiring-soon, expired, etc.)
          schema:
            type: string
            enum: [all, expiring-soon, expired, my-quests, in-progress, completed, canceled]
        - name: status
          in: query
          description: Filter by computed quest status
          schema:
            type: string
            enum: [all, active, completed, expired, draft]
        - name: category
          in: query
          description: Category filter (currently applied client-side)
          schema:
            type: string
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [newest, oldest, most-participants, highest-reward, ending-soon, most-progress]
            default: newest
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quest/{id}:
    get:
      tags:
        - quests
      summary: Get quest by ID or slug
