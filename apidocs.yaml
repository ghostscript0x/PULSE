  /grants:
    get:
      tags:
        - grants
      summary: List grants
      description: |
        Retrieve a paginated list of grants with optional filtering and sorting.
        Supports filtering by category, status, grantee, steward, cohort, and amount range.
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of grants per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search in project name, description, and team lead
          schema:
            type: string
        - name: category
          in: query
          description: Filter by grant category
          schema:
            type: string
            enum: [DeGrants, BlueSky, Community, SocialFi]
        - name: subcategory
          in: query
          description: Filter by grant subcategory (DeGrants only)
          schema:
            type: string
            enum: [Infrastructure, DeFi, NFTs, Community, Education, DeveloperTools, Governance, Analytics, LiveEvents, Creator]
        - name: status
          in: query
          description: Filter by grant status
          schema:
            type: string
            enum: [InProgress, Completed]
        - name: grantee
          in: query
          description: Filter by grantee STX address
          schema:
            type: string
        - name: steward
          in: query
          description: Filter by steward STX address
          schema:
            type: string
        - name: cohortNumber
          in: query
          description: Filter by cohort number (DeGrants only)
          schema:
            type: integer
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [createdAt, updatedAt, projectName, requestedAmount, awardedAmount, submittedDate, awardedDate, status]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: minAmount
          in: query
          description: Minimum awarded amount
          schema:
            type: number
        - name: maxAmount
          in: query
          description: Maximum awarded amount
          schema:
            type: number
        - name: includeStats
          in: query
          description: Return statistics instead of grant list
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GrantListResponse'
                  - $ref: '#/components/schemas/GrantStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /grants/Survey:
    get:
      tags:
        - grants
      summary: DeGrants 360° Survey – questions and report
      description: |
        **Get question sets (no auth):**
        - No query params → returns all question sets by respondent type.
        - `respondentType=Grantee|Steward|FoundationEndowment|ProgramFeedback` → returns the question set for that type.
        **Get summary report (auth, DeGrants admin):**
        - `report=1` → returns 360° summary report. Optional `cohortNumber`, `includeRawResponses=1`.
      parameters:
        - name: respondentType
          in: query
          description: Respondent type to get questions for
          schema:
            type: string
            enum: [Grantee, Steward, FoundationEndowment, ProgramFeedback]
        - name: report
          in: query
          description: If "1", return summary report (requires auth, DeGrants admin)
          schema:
            type: string
            enum: ["1"]
        - name: cohortNumber
          in: query
          description: Filter report by cohort (optional, when report=1)
          schema:
            type: integer
        - name: includeRawResponses
          in: query
          description: If "1", include raw responses in report (optional, when report=1)
          schema:
            type: string
            enum: ["1"]
      responses:
        '200':
          description: Question set(s) or report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: Either question sets, a single { respondentType, questions }, or the summary report
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /grants/{id}:
    get:
      tags:
        - grants
      summary: Get grant by ID
      description: Retrieve detailed information about a specific grant including milestones, grantee, steward, and payment tracking
      parameters:
        - name: id
          in: path
          required: true
          description: Grant ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events:
    get:
      tags:
        - events
      summary: List events
      operationId: get_events
      description: |
        Retrieve events with tab, type, sort and search filters.
        Tabs `my-events` and `attending` require authentication.
      parameters:
        - name: tab
          in: query
          description: Event tab filter
          schema:
            type: string
            enum: [upcoming, my-events, attending, past]
            default: upcoming
        - name: type
          in: query
          description: Event type filter
          schema:
            type: string
            enum: [all, virtual, irl]
            default: all
        - name: sortBy
          in: query
          description: Sorting option
          schema:
            type: string
            enum: [newest, oldest, most-attending, soonest]
            default: newest
        - name: search
          in: query
          description: Search in title and description
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - events
      summary: Create event
      operationId: create_event
      description: |
        Create a new event. Accepts multipart form-data to support cover image
        and badge image uploads.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventUpsertFormData'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{id}:
    get:
      tags:
        - events
      summary: Get event by ID
      operationId: get_event_by_id
      parameters:
        - name: id
          in: path
          required: true
          description: Event id (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - events
      summary: Update event
      operationId: update_event
      description: |
        Update editable fields for an event owned by the authenticated creator.
        Past events cannot be edited.
      parameters:
        - name: id
          in: path
          required: true
          description: Event id (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventUpsertFormData'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{id}/rsvp:
    post:
      tags:
        - events
      summary: RSVP (or stake) to event
      operationId: rsvp_event
      description: |
        RSVP to an event. For token-stake events, backend records `STAKED`.
      parameters:
        - name: id
          in: path
          required: true
          description: Event id (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRsvpRequest'
      responses:
        '201':
          description: RSVP successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Already RSVPed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - events
      summary: Cancel RSVP
      operationId: cancel_event_rsvp
      parameters:
        - name: id
          in: path
          required: true
          description: Event id (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCancelRsvpRequest'
      responses:
        '200':
          description: RSVP cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    # Base Types
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stxAddress:
          type: string
        username:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        twitter:
          type: string
          nullable: true
        discord:
          type: string
          nullable: true
        telegram:
          type: string
          nullable: true
        isXProfileVerified:
          type: boolean
          description: User has connected X (Twitter) via OAuth
        isDiscordProfileVerified:
          type: boolean
          description: User has connected Discord via OAuth
        isTelegramProfileVerified:
          type: boolean
          description: User has connected Telegram via OAuth
        website:
          type: string
          nullable: true
        githubUrl:
          type: string
          nullable: true
        linkedin:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            profileCompleteness:
              type: integer
              minimum: 0
              maximum: 100
            activityScore:
              type: integer
              minimum: 0

    Token:
      type: object
      properties:
        address:
          type: string
        identifier:
          type: string
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: integer
        imageURI:
          type: string
          nullable: true
        type:
          type: string
          enum: [Fungible, NonFungible, SemiFungible]

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        twitter:
          type: string
          nullable: true
        telegram:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        adminStxAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Grant Types
    GrantMilestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        milestoneNumber:
          type: integer
          minimum: 1
          maximum: 4
        name:
          type: string
        description:
          type: string
          nullable: true
        amount:
          type: number
          description: Payment amount for this milestone
        isCompleted:
          type: boolean
        completedDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        transactionUrl:
          type: string
          nullable: true
          description: STX transaction URL for proof of payment
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectName:
          type: string
        projectDescription:
          type: string
          nullable: true
        teamLead:
          type: string
        category:
          type: string
          enum: [DeGrants, BlueSky, Community, SocialFi]
        subcategory:
          type: string
          nullable: true
          enum: [Infrastructure, DeFi, NFTs, Community, Education, DeveloperTools, Governance, Analytics, LiveEvents, Creator]
        cohortNumber:
          type: integer
          nullable: true
          description: Cohort number for DeGrants
        status:
          type: string
          enum: [InProgress, Completed]
        requestedAmount:
          type: number
          description: Amount originally requested
        awardedAmount:
          type: number
          nullable: true
          description: Total amount awarded
        grantee:
          $ref: '#/components/schemas/User'
        steward:
          allOf:
            - $ref: '#/components/schemas/User'
            - nullable: true
        submittedDate:
          type: string
          format: date-time
        awardedDate:
          type: string
          format: date-time
          nullable: true
        githubUrl:
          type: string
          nullable: true
          description: GitHub repository URL for the project
        network:
          type: string
          enum: [Stacks, Ethereum, Base]
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/GrantMilestone'
        projectUpdates:
          type: array
          items:
            $ref: '#/components/schemas/ProjectUpdate'
        completedMilestones:
          type: integer
          description: Number of completed milestones
        totalMilestones:
          type: integer
          description: Total number of milestones
        completionPercentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of milestones completed
        totalMilestoneAmount:
          type: number
          description: Sum of all milestone amounts
        paidAmount:
          type: number
          description: Total amount paid out through completed milestones
        remainingAmount:
          type: number
          description: Amount remaining to be paid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GrantDetail:
      allOf:
        - $ref: '#/components/schemas/Grant'
        - type: object
          properties:
            nextMilestone:
              type: object
              nullable: true
              properties:
                milestoneNumber:
                  type: integer
                name:
                  type: string
                amount:
                  type: number
                dueDate:
                  type: string
                  format: date-time
                  nullable: true
                daysUntilDue:
                  type: integer
                  nullable: true
            milestoneHistory:
              type: array
              items:
                type: object
                properties:
                  milestoneNumber:
                    type: integer
                  name:
                    type: string
                  amount:
                    type: number
                  completedDate:
                    type: string
                    format: date-time
